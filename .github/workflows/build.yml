name: Build geo files

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Get upstream versions
        id: upstream
        run: |
          geosite_tag=$(curl -fsSL \
            https://api.github.com/repos/Loyalsoldier/domain-list-custom/releases/latest \
            | grep '"tag_name"' \
            | cut -d'"' -f4)

          geoip_tag=$(curl -fsSL \
            https://api.github.com/repos/Loyalsoldier/geoip/releases/latest \
            | grep '"tag_name"' \
            | cut -d'"' -f4)

          echo "geosite_tag=$geosite_tag" >> "$GITHUB_OUTPUT"
          echo "geoip_tag=$geoip_tag" >> "$GITHUB_OUTPUT"

      - name: Generate release tag
        id: release
        run: |
          echo "tag=$(date -u +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Download geosite.dat
        run: |
          curl -fL --retry 5 \
            -o geosite.dat \
            "https://github.com/Loyalsoldier/domain-list-custom/releases/download/${{ steps.upstream.outputs.geosite_tag }}/geosite.dat"

      - name: Download geoip.dat
        run: |
          curl -fL --retry 5 \
            -o geoip.dat \
            "https://github.com/Loyalsoldier/geoip/releases/download/${{ steps.upstream.outputs.geoip_tag }}/geoip.dat"

      - name: Filter geo files
        run: |
          python3 <<'PY'
          from pathlib import Path

          def varint(data, pos):
              value = 0
              shift = 0

              while True:
                  b = data[pos]
                  pos += 1
                  value |= (b & 0x7f) << shift

                  if not b & 0x80:
                      return value, pos

                  shift += 7

          def field(data, pos):
              key, pos = varint(data, pos)
              number = key >> 3
              wire_type = key & 7
              start = pos

              if wire_type == 0:
                  _, pos = varint(data, pos)
              elif wire_type == 1:
                  pos += 8
              elif wire_type == 2:
                  length, pos = varint(data, pos)
                  pos += length
              elif wire_type == 5:
                  pos += 4
              else:
                  raise ValueError(
                      f"Unsupported protobuf wire type: {wire_type}"
                  )

              return number, wire_type, start, pos

          def get_country_code(message):
              pos = 0

              while pos < len(message):
                  number, wire_type, start, end = field(message, pos)

                  if number == 1 and wire_type == 2:
                      length, value_start = varint(message, start)
                      value_end = value_start + length
                      return message[value_start:value_end].decode()

                  pos = end

              return None

          def filter_dat(filename, categories):
              data = Path(filename).read_bytes()
              output = bytearray()
              kept = []

              pos = 0

              while pos < len(data):
                  number, wire_type, start, end = field(data, pos)

                  if number != 1 or wire_type != 2:
                      output.extend(data[pos:end])
                      pos = end
                      continue

                  length, message_start = varint(data, start)
                  message_end = message_start + length

                  message = data[message_start:message_end]
                  code = get_country_code(message)

                  if code and code.lower() in categories:
                      output.extend(data[pos:end])
                      kept.append(code)

                  pos = message_end

              Path(filename).write_bytes(output)

              print(f"{filename}: kept {len(kept)} categories:")
              for code in kept:
                  print(f"  {code}")

          geosite_categories = {
              x.strip().lower()
              for x in Path("geosite-categories.txt").read_text().splitlines()
              if x.strip() and not x.lstrip().startswith("#")
          }

          geoip_categories = {
              x.strip().lower()
              for x in Path("geoip-categories.txt").read_text().splitlines()
              if x.strip() and not x.lstrip().startswith("#")
          }

          filter_dat("geosite.dat", geosite_categories)
          filter_dat("geoip.dat", geoip_categories)
          PY

      - name: Generate sha256
        run: |
          sha256sum geosite.dat > geosite.dat.sha256sum
          sha256sum geoip.dat > geoip.dat.sha256sum

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body: |
            Source geoip:
            https://github.com/Loyalsoldier/geoip/releases/tag/${{ steps.upstream.outputs.geoip_tag }}

            Source geosite:
            https://github.com/Loyalsoldier/domain-list-custom/releases/tag/${{ steps.upstream.outputs.geosite_tag }}
          files: |
            geosite.dat
            geosite.dat.sha256sum
            geoip.dat
            geoip.dat.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
