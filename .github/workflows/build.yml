name: Build geosite.dat

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Get upstream version
        id: upstream
        run: |
          tag=$(curl -fsSL \
            https://api.github.com/repos/Loyalsoldier/domain-list-custom/releases/latest \
            | grep '"tag_name"' \
            | cut -d'"' -f4)

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download geosite.dat
        run: |
          curl -fL --retry 5 \
            -o geosite.dat \
            "https://github.com/Loyalsoldier/domain-list-custom/releases/download/${{ steps.upstream.outputs.tag }}/geosite.dat"

      - name: Filter geosite.dat
        run: |
          python3 <<'PY'
          from pathlib import Path

          allowed = {
              x.strip().lower()
              for x in Path("categories.txt").read_text().splitlines()
              if x.strip() and not x.lstrip().startswith("#")
          }

          data = Path("geosite.dat").read_bytes()

          def varint(data, pos):
              value = 0
              shift = 0

              while True:
                  b = data[pos]
                  pos += 1
                  value |= (b & 0x7f) << shift

                  if not b & 0x80:
                      return value, pos

                  shift += 7

          def skip_field(data, pos, wire_type):
              if wire_type == 0:
                  _, pos = varint(data, pos)
                  return pos

              if wire_type == 1:
                  return pos + 8

              if wire_type == 2:
                  length, pos = varint(data, pos)
                  return pos + length

              if wire_type == 5:
                  return pos + 4

              raise ValueError(f"Unsupported protobuf wire type: {wire_type}")

          def field(data, pos):
              key, pos = varint(data, pos)
              field_number = key >> 3
              wire_type = key & 7

              start = pos

              if wire_type == 0:
                  _, pos = varint(data, pos)

              elif wire_type == 1:
                  pos += 8

              elif wire_type == 2:
                  length, pos = varint(data, pos)
                  pos += length

              elif wire_type == 5:
                  pos += 4

              else:
                  raise ValueError(
                      f"Unsupported protobuf wire type {wire_type}"
                  )

              return field_number, wire_type, start, pos

          def country_code(message):
              pos = 0

              while pos < len(message):
                  number, wire_type, start, end = field(message, pos)

                  if number == 1 and wire_type == 2:
                      length, value_start = varint(message, start)
                      value_end = value_start + length
                      return message[value_start:value_end].decode()

                  pos = end

              return None

          # GeoSiteList.entry = field 1.
          pos = 0
          output = bytearray()
          kept = []

          while pos < len(data):
              number, wire_type, start, end = field(data, pos)

              if number != 1 or wire_type != 2:
                  output.extend(data[pos:end])
                  pos = end
                  continue

              length, message_start = varint(data, start)
              message_end = message_start + length

              message = data[message_start:message_end]
              code = country_code(message)

              if code and code.lower() in allowed:
                  output.extend(data[pos:end])
                  kept.append(code)

              pos = message_end

          Path("geosite.dat").write_bytes(output)

          print(f"Kept {len(kept)} categories:")
          for code in kept:
              print(f"  {code}")
          PY

      - name: Generate sha256
        run: |
          sha256sum geosite.dat > geosite.dat.sha256sum

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.upstream.outputs.tag }}
          name: ${{ steps.upstream.outputs.tag }}
          files: |
            geosite.dat
            geosite.dat.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
